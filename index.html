<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Somos Luz</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Somos Luz">
<meta name="application-name" content="Somos Luz">

<style>
/* Layout: coluna de telemóvel (máx. 430px). Identidade do Manual Somos Luz: verde da capa, uma cor por etapa
   (amarelo, verde, azul, roxo), laranja para os Círculos, cinzento-escuro para ferramentas, lâmpadas e bandeirolas. */
:root{
  --capa:#9bc97a; --capa-soft:#eaf4e2;
  --paper:#ffffff; --bg:#f6f6f2; --outer:#dfe7d7; --line:#e3e3dc; --line2:#efefe9;
  --ink:#1a1a1a; --ink2:#4a4a48; --ink3:#6b6b68;
  --lamp:#fedd16;
  --e1:#fedd16; --e1s:#fff8c4; --e1i:#5c4d00;
  --e2:#00a651; --e2s:#e0f4e8; --e2i:#05612d;
  --e3:#01adee; --e3s:#ddf3fc; --e3i:#01577a;
  --e4:#91278e; --e4s:#f4e4f3; --e4i:#6e1d6c;
  --circ:#ed7d30; --circs:#fdeadb; --circi:#8a3d0c;
  --tool:#58585a;
  --ok:#00a651; --oks:#e0f4e8; --oki:#05612d;
  --mid:#e0bc00; --mids:#fff8c4; --midi:#5c4d00;
  --bad:#ce1f25; --bads:#fde3e3; --badi:#a3161b;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fira:'Fira Sans', system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--outer);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--capa)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--e3);outline-offset:2px}
.app{max-width:430px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--bg);display:flex;flex-direction:column;position:relative}
.pad{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.top{padding-block:16px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--capa);z-index:5}
.top .tt{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:13px;color:#1a2a10;font-weight:500}
.h1{font-size:26px;font-weight:700;letter-spacing:-.2px;margin:0;line-height:1.15;text-wrap:balance}
.top .sub{color:#1a2a10}
.h2{font-size:18px;font-weight:700;margin:0}
.sub{font-size:13px;color:var(--ink2)}
.hand{font-size:15px;line-height:1.35;color:var(--ink2);font-weight:500}
.me{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;border:0}
.back{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:none;margin-left:-10px}
main.stack{display:flex;flex-direction:column;gap:14px;padding-block:16px 28px;flex:1}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.card.tight{padding:4px 16px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
/* pincelada (como os títulos do manual) */
.brush{font-family:var(--fira);display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:6px 16px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;border-radius:16px 8px 18px 10px / 12px 18px 10px 16px}
.dash{border:0;border-top:2px dashed var(--line);margin:2px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:0;font-weight:700;font-size:16px;width:100%;padding:0 16px;text-decoration:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.lamp{background:var(--lamp);color:var(--ink)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{min-height:40px;font-size:14px;width:auto;padding:0 14px;border-radius:12px}
.dashed{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:2px dashed #b9b9b0;background:transparent;border-radius:14px;font-weight:700;width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--oks);color:var(--oki)}.p-mid{background:var(--mids);color:var(--midi)}.p-bad{background:var(--bads);color:var(--badi)}.p-grey{background:#eeeeea;color:var(--ink2)}
.p-circ{background:var(--circs);color:var(--circi)}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;color:var(--ink)}
.c0{background:#fff3a6}.c1{background:#cdeefb}.c2{background:#cdeedb}.c3{background:#fbdcc6}.c4{background:#ecd3eb}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;font-size:15px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#e9e9e2;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:46px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.seg button b{font-size:16px;color:var(--ink)}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;padding:0 5px;margin-left:4px}
.nav{position:sticky;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px max(4px, env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(4px, env(safe-area-inset-right,0px));z-index:6}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;font-size:12px;color:var(--ink2);padding:0;min-height:52px;font-weight:500}
.nav .ic{padding:4px 16px;border-radius:999px;display:flex}
.nav .on{color:var(--ink);font-weight:700}
.nav .on .ic{background:var(--lamp)}
/* início */
.big{font-size:54px;font-weight:700;line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end;height:100px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bar i{display:block;width:100%;border-radius:8px}
.bar-l{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:-6px}
.bar-l span{text-align:center;font-size:12px;color:var(--ink2)}
.tile{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.tile b{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:15px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ctile{border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.ctile b{font-size:36px;font-weight:700;line-height:1.1}
.ctile span{font-size:13px;font-weight:700;text-align:center}
.alert{display:flex;align-items:center;gap:10px;background:var(--bads);border-radius:14px;padding:12px 14px;color:var(--badi);font-weight:600}
.ihead{display:flex;align-items:center;gap:10px}
.ihead .sq{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
/* sessão em curso (cor da etapa) */
.now{font-family:var(--fira);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border:2px solid}
.crumb{font-family:var(--fira);display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;border-bottom:1.5px solid var(--ink);padding-bottom:4px}
.now h2{margin:0;font-size:21px;font-weight:700;line-height:1.25}
.now .meta{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.now .meta button{background:none;border:0;text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-weight:600}
.track{height:10px;background:#e9e9e2;border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px}
.lamps{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.segs{display:flex;gap:4px}
.segs div{height:8px;border-radius:999px;background:#e9e9e2;overflow:hidden}
.segs i{display:block;height:100%}
/* sessões */
.etapa{background:#fff;border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.etapa>button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 16px;text-align:left;min-height:64px}
.srow{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line2);padding:10px 16px;text-align:left;min-height:60px}
.num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.stype{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2)}
.stype.c{color:var(--circi);font-weight:600}
/* guia */
.gcard{background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.path{position:relative;width:340px;max-width:100%;margin:0 auto;overflow:hidden}
.node{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;width:150px;background:none;border:0;padding:0}
.node .circ{border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff}
.node .fl{font-size:12px;color:var(--ink2);margin-top:4px}
.node .fn{font-size:14px;font-weight:700;line-height:1.2}
.node .fs{font-size:12px;font-weight:700}
.now-tag{background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:6px}
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.trow:last-child{border-bottom:0}
.countbox{background:var(--e1s);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.countbox input{width:72px;min-height:44px;border-radius:12px;border:1.5px solid #e6d36a;text-align:center;font-weight:700;font-size:18px;background:#fff}
.cnt{background:#fff;border-radius:12px;padding:10px 6px;text-align:center}
.cnt b{display:block;font-size:20px;font-weight:700}
.cnt span{font-size:12px;color:var(--ink2)}
/* casos */
.caso{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.cbox{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.cbox .k{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
/* avaliar */
.note{display:flex;gap:10px;align-items:flex-start;border:2px dashed;border-radius:14px;padding:12px 14px}
.ecard{background:#fff;border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.ehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px}
.band{padding:8px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.mrow{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line2)}
.pt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opt{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.opt.on.sim,.opt.on.pres{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.on.parc{background:var(--lamp);border-color:var(--lamp);color:var(--ink)}
.opt.on.nao,.opt.on.falt{background:var(--bad);border-color:var(--bad);color:#fff}
.chk{display:flex;align-items:center;gap:10px;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-weight:600;background:#fff;width:100%;text-align:left}
.chk .bx{width:20px;height:20px;border-radius:5px;border:2px solid #8a8a85;display:flex;align-items:center;justify-content:center;flex:none}
.chk.on{border-color:var(--bad);background:var(--bads)}
.chk.on .bx{background:var(--bad);border-color:var(--bad)}
/* lista de presenças das mentorandas e mentorandos (√ / X como na ficha do manual) */
.kid{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line2);padding:0 8px 0 0}
.kid .tick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:54px;background:none;border:0;padding:0 0 0 16px;text-align:left}
.kid .bx{width:30px;height:30px;border-radius:8px;border:2px solid var(--ok);background:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.kid.off .bx{background:#fff;border-color:var(--bad)}
.kid.off .kn{color:var(--ink3);text-decoration:line-through}
.kid .kn{font-weight:600}
.kid .flag{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.kid .flag.on{background:var(--bads);border-color:var(--bad)}
.cs{position:relative;display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.cs input{position:absolute;opacity:0;pointer-events:none}
.cs:has(input:checked){background:var(--bads);border-color:var(--bad);color:var(--badi)}
.cs:has(input:focus-visible){outline:3px solid var(--e3);outline-offset:2px}
.kidnote{padding:0 16px 12px 58px}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:15px}
textarea{min-height:76px;resize:vertical}
label.lb{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
.foot{position:sticky;bottom:0;background:var(--bg);border-top:1.5px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:6}
/* recursos */
.res{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
/* folha + aviso */
.sheet-wrap{position:fixed;inset:0;background:rgba(26,26,26,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:430px;border-radius:22px 22px 0 0;padding:20px max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.radio{display:flex;align-items:center;gap:10px;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-weight:500}
.radio input{width:20px;height:20px;accent-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;padding:32px 16px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:10px}
/* ---- adaptação a telemóveis e tablets ---- */
/* telemóveis pequenos (≤ 360 px) */
@media (max-width:360px){
 .h1{font-size:22px}
 .big{font-size:44px}
 .ctile b{font-size:28px}
 .ctile span{font-size:12px}
 .opt{font-size:13px}
 .tile b{font-size:26px}
 .nav button{font-size:11px}
 .nav .ic{padding:4px 10px}
}
/* tablets (≥ 600 px): coluna mais larga, cabeçalho e menu a toda a largura */
@media (min-width:600px){
 body{background:var(--bg);font-size:16px}
 .app{max-width:760px}
 .pad{padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
 .top{box-shadow:0 0 0 100vmax var(--capa);clip-path:inset(0 -100vmax)}
 .nav{box-shadow:0 0 0 100vmax #fff;clip-path:inset(0 -100vmax)}
 .foot{box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
 body::before{background:var(--capa)}
 main.stack{gap:18px;padding-block:20px 32px}
 .h1{font-size:30px}
 .h2{font-size:20px}
 .big{font-size:64px}
 .bars{height:120px}
 .card{padding:20px}
 .nav button{font-size:13px;min-height:58px}
 .tarefa-btn{flex:0 0 auto!important}
 .now .btn{align-self:flex-start;width:auto;padding:0 28px}
 .sheet-wrap{align-items:center;padding:24px}
 .sheet{max-width:600px;border-radius:22px;max-height:86vh}
}
/* tablets na horizontal (≥ 1000 px) */
@media (min-width:1000px){
 .app{max-width:880px}
}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>

<body>
<div class="app" id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
/* ---------- ícones ---------- */
const sv=(p,s=22,c='currentColor',w=2)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
 home:s=>sv('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',s),
 flag:s=>sv('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',s),
 users:(s,c)=>sv('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.2c2.2.6 3.5 2.6 3.5 5.8"/>',s,c),

  <div style="${g}"><span></span><span class="sub" style="text-align:center;font-weight:700;color:var(--ink)">Nossa escola</span><span class="sub" style="text-align:center;font-weight:700">Outras escolas</span></div>
  <div style="${g}"><span style="font-weight:600">Participação</span>${cell(nos+'%',nos>=out)}${grey(out+'%')}</div>

/* alerta compacto no topo do Início: o que o professor tem de fazer agora */
function tarefaAgora(){
 const s=agora(); if(!s) return '';

 return `<section style="font-family:var(--fira);background:${e.s};border:2px solid ${e.c};border-radius:16px;padding:10px 12px 10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px">
  <div class="grow" style="display:flex;flex-direction:column;gap:2px;min-width:190px"><span class="row" style="gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px">${I.pennant(e.hex,18)} Por fazer agora</span><span style="font-weight:700;font-size:15px;line-height:1.25">Sessão ${s.n} · ${esc(s.titulo)}</span></div>
  <button class="btn dark small tarefa-btn" style="flex:1 0 auto;max-width:100%;min-height:44px" data-a="avaliar" data-n="${s.n}">${I.check(16,'#fff')} Registar presenças</button>
 </section>`;
}

  <div class="row" style="align-items:flex-end"><span class="big">${avg}%</span><div class="stack-s" style="gap:6px;padding-bottom:6px"><span class="pill ${lc}" style="align-self:flex-start;font-size:14px">${lv}</span><span class="sub" style="font-size:14px">média dos últimos ${circ.length} Círculos</span></div></div>
  <div class="bars">${circ.map(x=>`<div class="bar"><span style="color:${x.pres<60?'var(--badi)':'var(--ink)'}">${x.pres}%</span><i style="height:${Math.max(6,Math.round(x.pres*0.62))}px;background:${nivel(x.pres)[2]}"></i></div>`).join('')}</div>
  <div class="bar-l">${circ.map(x=>`<span style="${x.pres<60?'color:var(--badi);font-weight:700':''}">Sessão ${x.n}</span>`).join('')}</div>

   <div class="grid2">${metaTile(nM,S.metaM,'Mentores')}${metaTile(nA,S.metaA,'Mentorandos')}</div></div>

 <section class="card stack-s" style="gap:14px">
  <span class="brush" style="background:var(--tool);color:#fff">${I.mega(16,'#fff')} Atenção especial</span>
  <span class="sub" style="font-size:14px;margin-top:-6px">${ca+ce+cr} casos no total</span>
  <div class="grid3">
   <button class="ctile" data-a="casos" data-t="acompanhar" style="background:var(--bads);border-color:var(--bad);color:var(--badi)"><b>${ca}</b><span>Por resolver</span></button>

  </div>
  <button class="btn dark" data-a="casos" data-t="acompanhar">Ver os casos ${I.arrow(18)}</button>

 ${percurso()}
 ${comparar()}
 ${indicadoresCard()}
 </main>`+nav();
};

 const l5=circ.slice(-5); const avg=l5.length?Math.round(l5.reduce((a,s)=>a+s.pres,0)/l5.length):0;
 const saidos=[...S.mentores.filter(m=>m.saiu),...S.mentorandos.filter(m=>m.saiu)];
 return top('Assiduidade',`Média dos últimos 5 Círculos: <b style="color:var(--ink)">${avg}%</b>`,{back:true})+`<main class="stack pad">
 <div class="note" style="border-color:var(--capa)">${I.mega(22)}<span class="hand">«Sejam assíduos e pontuais. Todos são importantes nesta jornada.» — Dicas de Mentoria</span></div>

  <div class="row"><span class="pill p-mid" style="min-width:68px;justify-content:center">Atenção</span><span>entre 60% e 79%</span></div>
  <div class="row"><span class="pill p-bad" style="min-width:68px;justify-content:center">Baixa</span><span>menos de 60%</span></div>

 </section>
 <section class="card tight"><h2 class="h2" style="padding:12px 0 4px">Por sessão do Círculo</h2>
  ${circ.slice().reverse().map(s=>{const [l,c]=nivel(s.pres);const e=etapaDe(s.n);return `<div class="item"><span class="num" style="background:${e.c};color:${e.on}">${s.n}</span><span class="grow">${esc(s.titulo)}</span><b>${s.pres}%</b><span class="pill ${c}">${l}</span></div>`}).join('')}
 </section>
 <section class="card stack-s"><h2 class="h2">Desistências · ${saidos.length}</h2>
  ${saidos.length?saidos.map(m=>`<div class="tile" style="gap:3px"><span style="font-weight:700;font-size:16px;color:var(--ink)">${esc(m.nome)}</span><span class="sub">${esc(m.classe)} · ${esc(dnome(m.dupla))} · ${esc(m.saiu.quando)}</span><span style="color:var(--ink);font-size:15px">${esc(m.saiu.motivo)}</span></div>`).join(''):'<span class="sub">Ninguém desistiu.</span>'}
 </section>
 </main>`+nav();
};

V.casos=()=>{
 const t=S.ctab; const L=S.casos.filter(c=>c.estado===t);
 const tabs=[['acompanhar','Por resolver'],['encaminhado','Encaminhados'],['resolvido','Resolvidos']];
 return top('Atenção especial','Todos os casos da EPC de Búzi',{back:true})+`<main class="stack pad">
 <div class="seg" role="tablist">${tabs.map(([id,l])=>`<button role="tab" class="${t===id?'on':''}" aria-selected="${t===id}" data-a="ctab" data-id="${id}">${l}<b>${casosN(id)}</b></button>`).join('')}</div>
 <div class="note" style="border-color:var(--tool)">${I.mega(22)}<span class="hand">«O que acontece no Círculo, fica no Círculo» — a não ser que esteja em causa a segurança de alguém.</span></div>
 ${L.length?L.map(c=>{
  const box=c.estado==='acompanhar'?'':c.estado==='encaminhado'?`<div class="cbox" style="background:var(--e3s);color:var(--e3i)"><span class="k">${I.send(14)} Encaminhado</span><span>${esc(c.enc)}</span></div>`:`<div class="cbox" style="background:var(--oks);color:var(--oki)"><span class="k">${I.check(14)} Resolvido</span><span>${esc(c.res)}</span></div>`;
  return `<article class="caso">

   <div class="cbox" style="background:${c.estado==='acompanhar'?'var(--bads)':'var(--bg)'}"><span class="k" style="color:${c.estado==='acompanhar'?'var(--badi)':'var(--ink2)'}">Sessão ${c.sessao}</span><span>${esc(c.texto)}</span></div>
   ${box}
   ${c.estado!=='resolvido'?`<div class="row" style="gap:8px">${c.estado==='acompanhar'?`<button class="btn ghost small" data-a="sheet" data-type="encaminhar" data-id="${c.id}">${I.send(16)} Encaminhar</button>`:''}<button class="btn ghost small" data-a="sheet" data-type="resolver" data-id="${c.id}">${I.check(16)} Resolver</button></div>`:''}
  </article>`;}).join(''):`<div class="empty">${I.check(30,'var(--ok)')}<span>Não há casos aqui.</span></div>`}

V.guia=()=>{
 const cur=S.fases.findIndex((f,i)=>faseEstado(i)==='now');
 const ci=cur<0?S.fases.length-1:cur; const F=S.fases[ci];
 const done=tarefasFeitas(), tot=tarefasTotal();

 let path=''; X.forEach((x,i)=>{const y=Y0+i*DY+38;path+=(i?' L':'M')+x+' '+y;});
 return top('Guia da escola','Implementação do Programa de Mentoria Escolar')+`<main class="stack pad">
 <section class="gcard"><div class="between"><div><div style="font-size:12px;font-weight:700;color:var(--lamp)">Fase ${ci+1} de ${S.fases.length}</div><div style="font-size:22px;font-weight:700">${esc(F.nome)}</div></div>${lamp(true,48,'#fedd16')}</div>
  <div class="track" style="background:#3a3a38"><i style="width:${Math.round(done/tot*100)}%;background:var(--lamp)"></i></div>
  <span style="font-size:13px;color:#ddd">${done} de ${tot} tarefas feitas</span></section>
 <div class="path" style="height:${H}px">
  <svg aria-hidden="true" width="340" height="${H}" viewBox="0 0 340 ${H}" style="position:absolute;inset:0"><path d="${path}" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="9 8"/></svg>
  ${S.fases.map((f,i)=>{const st=faseEstado(i);const sz=st==='now'?84:66;const y=Y0+i*DY+38-sz/2-(st==='now'?24:0);
   const fe=f.t.filter(t=>t.feita).length;
   return `<button class="node" data-a="go" data-r="fase" data-n="${i}" style="left:${X[i]}px;top:${y}px" aria-label="Fase ${i+1}: ${esc(f.nome)}">
    ${st==='now'?'<span class="now-tag">Fase em curso</span>':''}
    <span class="circ" style="width:${sz}px;height:${sz}px;${st==='done'?'border:3px solid var(--capa)':st==='now'?'background:var(--e1s);border:3px solid var(--lamp)':'border:2px dashed #b9b9b0'}">${lamp(st!=='off',st==='now'?56:44,'#fedd16')}</span>
    <span class="fl">Fase ${i+1}</span><span class="fn">${esc(f.nome)}</span>
    <span class="fs" style="color:${st==='done'?'var(--oki)':st==='now'?'var(--e1i)':'var(--ink3)'}">${st==='done'?'Concluída':st==='now'?`Em curso · ${fe}/${f.t.length}`:'Por começar'}</span></button>`}).join('')}
 </div>
 </main>`+nav();
};

  <span class="hand">Cada Círculo tem 10 Mentorandos: 5 raparigas e 5 rapazes. Cada Dupla é uma rapariga e um rapaz.</span></section>`:''}
 <span class="brush" style="background:var(--tool);color:#fff">Qual a tarefa? · Já fizeram?</span>
 <section class="card tight">${f.t.map((t,j)=>`<div class="trow">
  <button class="chk ${t.feita?'':''}" style="width:auto;min-height:44px;border:0;padding:0;background:none" data-a="tarefa" data-f="${i}" data-t="${j}" ${st==='off'?'disabled':''} aria-pressed="${t.feita}" aria-label="${t.feita?'Feita':'Marcar como feita'}: ${esc(t.nome)}"><span class="bx" style="width:28px;height:28px;border-radius:8px;${t.feita?'background:var(--ok);border-color:var(--ok)':''}">${t.feita?I.check(16,'#fff'):''}</span></button>

 </section></main>`+nav();

V.participantes=()=>{
 const t=S.ptab; const semDupla=act(S.mentorandos).filter(m=>!m.dupla).length;
 const tabs=`<div class="seg" role="tablist" style="background:transparent;padding:0;gap:8px">${[['duplas','Duplas','#eaf4e2','#9bc97a'],['mentores','Mentores','#fff8c4','#e6c84a'],['mentorandos','Mentorandos','#fdeadb','#f0a36b']].map(([id,l,bg,bd])=>`<button role="tab" class="${t===id?'on':''}" style="background:${bg};border:2px solid ${t===id?bd:'transparent'};color:var(--ink);${t===id?'font-weight:700;box-shadow:none':''}" aria-selected="${t===id}" data-a="ptab" data-id="${id}"><span>${l}${id==='mentorandos'&&semDupla?`<span class="badge" aria-label="${semDupla} sem dupla">${semDupla}</span>`:''}</span></button>`).join('')}</div>`;

  body=`<button class="dashed" data-a="sheet" data-type="novoMentor">${I.uadd(20)} Adicionar Mentor</button>

  <section class="card tight">${L.map(m=>`<div class="item"><span class="av ${col(m.nome)}">${ini(m.nome)}</span><div class="grow"><div class="nm">${esc(m.nome)}</div><div class="sub" style="${m.dupla?'':'color:var(--badi);font-weight:700'}">${esc(m.classe)}${m.nasc?' · '+idade(m.nasc)+' anos':''} · ${esc(dnome(m.dupla))}</div></div><button class="icon-btn" data-a="sheet" data-type="pessoa" data-k="a" data-id="${m.id}" aria-label="Opções de ${esc(m.nome)}">${I.ucog(20)}</button></div>`).join('')}</section>

  <span style="font-weight:700">Encarregado de educação</span>
  <div><label class="lb" for="encNome">Nome do encarregado</label><input id="encNome" type="text" autocomplete="off" placeholder="Ex.: Ana Mabote"></div>
  <div><label class="lb" for="encTel">Contacto <span class="sub">(opcional)</span></label><input id="encTel" type="text" inputmode="tel" autocomplete="off" placeholder="Ex.: 84 123 4567"></div>
  <hr class="dash">
  <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"><legend class="lb">Está em situação de deslocamento?</legend>
   <div class="grid2"><label class="radio"><input type="radio" name="desl" value="nao" data-bind="desl" checked>Não</label><label class="radio"><input type="radio" name="desl" value="sim" data-bind="desl">Sim</label></div>
   <div id="deslDe" hidden style="display:flex;flex-direction:column;gap:8px"><span class="lb" style="margin:0">Qual a situação?</span>
   <label class="radio"><input type="radio" name="deslTipo" value="Comunidade de acolhimento" checked>Comunidade de acolhimento</label><label class="radio"><input type="radio" name="deslTipo" value="Deslocado/a forçado/a">Deslocado/a forçado/a</label>
   <label class="lb" for="deslOnde" style="margin:4px 0 0">De onde é deslocado/a?</label><input id="deslOnde" type="text" autocomplete="off" placeholder="Ex.: Macomia, Cabo Delgado"></div></fieldset>
  <hr class="dash">
  <div><label class="lb" for="saude">Tem algum problema de saúde? <span class="sub">(opcional)</span></label><textarea id="saude" placeholder="Ex.: asma, usa óculos… Deixar em branco se não tiver."></textarea></div>
  <button class="btn dark" data-a="doNovo" data-k="${isM?'m':'a'}">${I.plus()} ${isM?'Adicionar':'Inscrever'}</button>`;}
 if(sh.type==='pessoa'){const L=sh.k==='m'?S.mentores:S.mentorandos;const p=L.find(x=>x.id===sh.id);
  if(sh.step==='sair') return head('Registar desistência',esc(p.nome))+`<div><label class="lb" for="nota">Porque deixou o programa?</label><textarea id="nota" placeholder="Ex.: mudou de escola"></textarea></div><button class="btn dark" data-a="doSair" data-k="${sh.k}" data-id="${p.id}">Confirmar desistência</button><button class="btn ghost" data-a="sheet" data-type="pessoa" data-k="${sh.k}" data-id="${p.id}">Cancelar</button>`;
  return head(esc(p.nome),esc(p.classe)+(p.nasc?' · '+idade(p.nasc)+' anos':'')+' · '+esc(dnome(p.dupla)))+`${p.enc||p.nasc?`<div class="tile" style="gap:6px;color:var(--ink)">${p.nasc?`<span class="sub">Nascimento: <b style="color:var(--ink)">${esc(p.nasc.split('-').reverse().join('/'))}</b> (${idade(p.nasc)} anos)</span>`:''}${p.enc?`<span class="sub">Encarregado: <b style="color:var(--ink)">${esc(p.enc.nome)}</b>${p.enc.tel?' · '+esc(p.enc.tel):''}</span>`:''}${p.desl?`<span class="sub">Deslocamento: <b style="color:var(--ink)">${esc(p.desl.tipo)} · de ${esc(p.desl.de)}</b></span>`:''}${p.saude?`<span class="sub">Saúde: <b style="color:var(--ink)">${esc(p.saude)}</b></span>`:''}</div>`:''}<div><label class="lb" for="dup">Dupla</label><select id="dup"><option value="">Sem dupla</option>${S.duplas.map(d=>`<option value="${d.id}" ${p.dupla===d.id?'selected':''}>${esc(d.nome)}</option>`).join('')}</select></div>
  <button class="btn dark" data-a="doDupla" data-k="${sh.k}" data-id="${p.id}">Guardar</button>
  <button class="btn ghost" style="color:var(--badi)" data-a="sairStep" data-k="${sh.k}" data-id="${p.id}">Registar desistência</button>`;}
 if(sh.type==='dupla'){const d=sh.id?dupla(sh.id):null;
  const pool=act(S.mentores).filter(m=>!m.dupla||(d&&m.dupla===d.id));
  return head(d?'Alterar Mentores':'Criar dupla',d?esc(d.nome):'Uma rapariga e um rapaz, sem dupla')+`${d?'':`<div><label class="lb" for="nome">Nome da dupla</label><input id="nome" type="text" placeholder="Ex.: Dupla Girassol"></div>`}
  <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"><legend class="lb">Escolher 2</legend>${pool.map(m=>`<label class="radio"><input type="checkbox" name="mm" value="${m.id}" ${d&&m.dupla===d.id?'checked':''}>${esc(m.nome)} <span class="sub">${esc(m.classe)}</span></label>`).join('')||'<span class="sub">Não há Mentores sem dupla.</span>'}</fieldset>
  <button class="btn dark" data-a="doDuplaSave" data-id="${d?d.id:''}">Guardar</button>`;}
 return '';
}

/* ---------- render ---------- */
const app=document.getElementById('app'), sheetEl=document.getElementById('sheet'), toastEl=document.getElementById('toast');
function render(toTop){
 const keep=window.scrollY;
 app.innerHTML=V[S.route]();
 if(S.sheet){sheetEl.innerHTML=`<div class="sheet-wrap" data-a="closeBg"><div class="sheet" role="dialog" aria-modal="true">${sheetHTML()}</div></div>`;sheetEl.hidden=false;}
 else {sheetEl.innerHTML='';sheetEl.hidden=true;}
 window.scrollTo(0,toTop?0:keep);
}
let tt;
function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toastEl.hidden=true,2600);}
const hist=[];
function go(r,params){hist.push({route:S.route,params:S.params});S.route=r;S.params=params||{};S.sheet=null;render(true);}

const A={
 tab:d=>{S.tab=d.id;S.route=d.id;S.params={};hist.length=0;S.sheet=null;render(true);},
 go:d=>go(d.r,{n:d.n}),
 back:()=>{const h=hist.pop();if(h){S.route=h.route;S.params=h.params;}else{S.route=S.tab;}S.sheet=null;render(true);},
 casos:d=>{S.ctab=d.t;go('casos');},
 ctab:d=>{S.ctab=d.id;render();},
 ptab:d=>{S.ptab=d.id;render();},
 etapa:d=>{S.open[d.n]=!S.open[d.n];render();},
 toast:d=>toast(d.msg),
 sheet:d=>{S.sheet={type:d.type,id:d.id,n:d.n?+d.n:null,k:d.k};render();},
 close:()=>{S.sheet=null;render();},
 closeBg:()=>{S.sheet=null;render();},
 sessao:d=>{const s=ses(+d.n);S.sheet={type:'sessao',n:s.n};render();},
 avaliar:d=>{const s=ses(+d.n);const p={};
  act(S.mentores).filter(m=>m.dupla).forEach(x=>p[x.id]={pres:true,resp:null,at:false,nota:''});
  if(s.tipo==='C') act(S.mentorandos).filter(m=>m.dupla&&mentoresDe(m.dupla).length).forEach(x=>p[x.id]={pres:true,at:false,nota:''});
  S.ev={n:s.n,p};go('avaliar');},
 presM:d=>{const r=S.ev.p[d.id];r.pres=d.v==='1';if(!r.pres){r.resp=null;}render();},
 presK:d=>{const r=S.ev.p[d.id];r.pres=!r.pres;render();},
 todos:d=>{menDe(d.d).forEach(m=>{if(S.ev.p[m.id])S.ev.p[m.id].pres=true;});render();},
 resp:d=>{const r=S.ev.p[d.id];r.resp=r.resp===d.v?null:d.v;render();},
 doRisco:d=>{const cats=[...document.querySelectorAll('input[name=rc]:checked')].map(x=>x.value);if(!cats.length){toast('Escolha pelo menos uma situação.');return;}
  const urg=(document.querySelector('input[name=ru]:checked')||{}).value||'normal';const nota=document.getElementById('rn').value.trim();
  const r=S.ev.p[d.id];r.risco={cats,urg,nota};r.at=true;r.nota=(urg==='urgente'?'URGENTE · ':'')+cats.join(', ')+(nota?' — '+nota:'');S.sheet=null;render();toast('Situação de risco registada');},
 delRisco:d=>{const r=S.ev.p[d.id];r.risco=null;r.at=false;r.nota='';S.sheet=null;render();toast('Reporte retirado');},
 guardar:()=>{
  const s=ses(S.ev.n);const ids=Object.keys(S.ev.p);
  const find=i=>S.mentores.find(x=>x.id===i)||S.mentorandos.find(x=>x.id===i);
  const kids=ids.filter(i=>i[0]==='a');
  let msg;
  if(s.tipo==='C'&&kids.length){const pres=kids.filter(i=>S.ev.p[i].pres).length;s.pres=Math.round(pres/kids.length*100);msg=`${pres} de ${kids.length} no Círculo`;
   S.duplas.forEach(d=>{const m=kids.filter(i=>find(i).dupla===d.id);if(!m.length)return;const pct=Math.round(m.filter(i=>S.ev.p[i].pres).length/m.length*100);d.pct=d.pct==null?pct:Math.round((d.pct*8+pct)/9);});}
  else {const ms=ids.filter(i=>i[0]==='m');msg=`${ms.filter(i=>S.ev.p[i].pres).length} de ${ms.length} Mentores`;}
  let novos=0;
  ids.forEach(i=>{const r=S.ev.p[i];if(!r.at)return;const p=find(i);const ex=S.casos.find(c=>c.nome===p.nome&&c.estado!=='resolvido');
   if(ex){ex.vezes++;ex.sessao=s.n;ex.texto=r.nota||ex.texto;}else S.casos.unshift({id:'k'+(uid++),nome:p.nome,papel:i[0]==='m'?'Mentor':'Mentorando',dupla:p.dupla,sessao:s.n,texto:r.nota||'Requer atenção especial.',estado:'acompanhar',vezes:1});novos++;});
  s.estado='feita';const nx=ses(s.n+1);if(nx)nx.estado='agora';
  const e=nx&&etapaDe(nx.n);if(e)S.open[e.n]=true;
  const etapaFeita=ETAPAS.find(x=>x.ate===s.n);
  S.ev=null;S.tab='sessoes';S.route='sessoes';hist.length=0;render(true);
  toast(etapaFeita?`Parabéns!! Etapa ${etapaFeita.n} concluída — mais uma lâmpada acesa!`:`Sessão ${s.n} guardada · ${msg}${novos?` · ${novos} caso(s) novo(s)`:''}`);
 },
 doEnc:d=>{const c=S.casos.find(x=>x.id===d.id);const para=(document.querySelector('input[name=para]:checked')||{}).value||'à diretora pedagógica';const n=document.getElementById('nota').value.trim();
  c.estado='encaminhado';c.enc='Encaminhado '+para+(n?', '+n:'')+'.';S.sheet=null;render();toast('Caso encaminhado');},
 doRes:d=>{const c=S.casos.find(x=>x.id===d.id);const n=document.getElementById('nota').value.trim();c.estado='resolvido';c.res=n||'Resolvido.';S.sheet=null;render();toast('Caso resolvido');},
 doMetas:()=>{const a=parseInt(document.getElementById('mM').value,10),b=parseInt(document.getElementById('mA').value,10);if(!(a>0&&b>0)){toast('Escreva metas maiores que zero.');return;}S.metaM=a;S.metaA=b;S.sheet=null;render();toast('Metas guardadas');},
 doData:d=>{const v=document.getElementById('dt').value;if(!v){toast('Escolha uma data.');return;}const [y,m,dd]=v.split('-');ses(+d.n).data=`${dd}/${m}/${y}`;S.sheet=null;render();toast('Data guardada');},
 doNovo:d=>{const g=id=>document.getElementById(id).value.trim();const nome=g('nome');if(!nome){toast('Escreva o nome.');return;}
  const nasc=g('nasc');if(!nasc){toast('Indique a data de nascimento.');return;}
  const encNome=g('encNome');if(!encNome){toast('Escreva o nome do encarregado de educação.');return;}
  if((document.querySelector('input[name=desl]:checked')||{}).value==='sim'&&!g('deslOnde')){toast('Indique de onde veio a pessoa deslocada.');return;}
  const o={id:(d.k==='m'?'m':'a')+(uid++),nome,classe:g('classe'),sexo:g('sexo'),nasc,enc:{nome:encNome,tel:g('encTel')},saude:g('saude'),desl:(document.querySelector('input[name=desl]:checked')||{}).value==='sim'?{tipo:(document.querySelector('input[name=deslTipo]:checked')||{}).value,de:g('deslOnde')}:null,dupla:g('dup')||null,saiu:null};
  (d.k==='m'?S.mentores:S.mentorandos).unshift(o);S.sheet=null;render();toast(nome+' adicionado(a)');},
 doDupla:d=>{const p=(d.k==='m'?S.mentores:S.mentorandos).find(x=>x.id===d.id);p.dupla=document.getElementById('dup').value||null;S.sheet=null;render();toast('Guardado');},
 sairStep:d=>{S.sheet={type:'pessoa',k:d.k,id:d.id,step:'sair'};render();},
 doSair:d=>{const p=(d.k==='m'?S.mentores:S.mentorandos).find(x=>x.id===d.id);const n=document.getElementById('nota').value.trim();p.saiu={motivo:n||'Motivo não indicado.',quando:'hoje'};if(d.k==='m')p.dupla=null;S.sheet=null;render();toast('Desistência registada');},
 doDuplaSave:d=>{const sel=[...document.querySelectorAll('input[name=mm]:checked')].map(x=>x.value);if(sel.length!==2){toast('Escolha exactamente 2.');return;}
  let id=d.id;if(!id){const nome=document.getElementById('nome').value.trim();if(!nome){toast('Escreva o nome da dupla.');return;}id='d'+(uid++);S.duplas.push({id,nome:/^dupla/i.test(nome)?nome:'Dupla '+nome,pct:null});}
  S.mentores.forEach(m=>{if(m.dupla===id)m.dupla=null;});sel.forEach(i=>S.mentores.find(m=>m.id===i).dupla=id);S.sheet=null;render();toast('Dupla guardada');},
 tarefa:d=>{const t=S.fases[+d.f].t[+d.t];t.feita=!t.feita;t.data=t.feita?new Date().toLocaleDateString('pt-PT'):null;render();if(t.feita)toast('Tarefa feita!');}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='closeBg'&&e.target!==el)return;const fn=A[el.dataset.a];if(!fn)return;fn(el.dataset,el,e);});
document.addEventListener('input',e=>{const b=e.target.dataset.bind;if(!b)return;
 if(b==='desl'){const d=document.getElementById('deslDe');if(d)d.hidden=e.target.value!=='sim';return;}
 if(b==='indF'){S.indF=e.target.value;render();return;}
 if(b==='indAno'){S.indAno=e.target.value;render();return;}
 if(b==='nota'){S.ev.p[e.target.dataset.id].nota=e.target.value;}
 if(b==='nasc'){const t=document.getElementById('idadeTxt');const a=idade(e.target.value);if(t)t.textContent=(a!=null&&a>=0)?a+' anos':'';}
 if(b==='alunos'){S.alunos=Math.max(0,parseInt(e.target.value||'0',10));render();const i=document.getElementById('alunos');if(i)i.focus();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}});
render(true);
})();
</script>
</body>
</html>
